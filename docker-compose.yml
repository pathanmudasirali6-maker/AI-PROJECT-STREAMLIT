version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/dataset:/app/backend/dataset
      - ./backend/saved_models:/app/backend/saved_models
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
